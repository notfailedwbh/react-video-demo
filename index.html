<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黄金：跨越万年的特殊存在</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    :root { --gold: #FFD700; --gold-dark: #B8860B; --bg: #050505; }
    body { margin: 0; padding: 0; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, sans-serif; overflow: hidden; color: white; }
    
    /* 核心动画库 */
    @keyframes spin { 100% { transform: rotateY(360deg) rotateX(360deg); } }
    @keyframes pulse-ring { 0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 30px rgba(255, 215, 0, 0); } 100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); } }
    @keyframes draw-line { to { stroke-dashoffset: 0; } }
    @keyframes noise-wave { 0% { d: path("M0,100 Q50,150 100,100 T200,100 T300,100"); } 25% { d: path("M0,100 Q50,0 100,200 T200,50 T300,250"); } 50% { d: path("M0,100 Q50,250 100,0 T200,200 T300,0"); } 75% { d: path("M0,100 Q50,50 100,150 T200,0 T300,150"); } 100% { d: path("M0,100 Q50,150 100,100 T200,100 T300,100"); } }
    
    /* 立方体 3D 样式 */
    .cube-container { perspective: 1000px; }
    .cube { width: 200px; height: 200px; position: relative; transform-style: preserve-3d; animation: spin 20s infinite linear; }
    .face { position: absolute; width: 200px; height: 200px; border: 2px solid var(--gold); background: rgba(255, 215, 0, 0.1); box-shadow: inset 0 0 50px rgba(255, 215, 0, 0.2); }
    .front  { transform: translateZ(100px); } .back { transform: rotateY(180deg) translateZ(100px); }
    .right  { transform: rotateY(90deg) translateZ(100px); } .left { transform: rotateY(-90deg) translateZ(100px); }
    .top    { transform: rotateX(90deg) translateZ(100px); } .bottom { transform: rotateX(-90deg) translateZ(100px); }
  </style>
</head>
<body>
  <div id="root" style="width: 100%;"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 平滑插值函数 (缓动)
    const smoothStep = (min, max, value) => Math.max(0, Math.min(1, (value - min) / (max - min)));
    const easeOutExp = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);

    function MasterpieceVisuals() {
      // 视频总时长控制器 (演示用 1500 帧，约 50 秒。实际使用时可调大以匹配口播长度)
      const TOTAL_FRAMES = 1500; 
      const [frame, setFrame] = useState(0);

      useEffect(() => {
        const timer = setInterval(() => {
          setFrame(f => (f >= TOTAL_FRAMES ? 0 : f + 1));
        }, 1000 / 30);
        return () => clearInterval(timer);
      }, []);

      // 屏幕自适应
      const [scale, setScale] = useState(1);
      useEffect(() => {
        const handleResize = () => setScale(Math.min(window.innerWidth / 1920, window.innerHeight / 1080));
        window.addEventListener('resize', handleResize);
        handleResize();
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // ====== 章节时间轴映射 (返回 0 到 1 的进度) ======
      // 1. 引言与万能属性 (0-200帧)
      const introProgress = smoothStep(0, 150, frame) - smoothStep(180, 200, frame);
      // 2. 极度稀缺 22m立方体 (200-450帧)
      const scarcityProgress = smoothStep(200, 250, frame) - smoothStep(400, 450, frame);
      // 3. 供给之王南非 (450-700帧)
      const supplyProgress = smoothStep(450, 500, frame) - smoothStep(650, 700, frame);
      // 4. 三大交易中心枢纽 (700-1000帧)
      const tradingProgress = smoothStep(700, 750, frame) - smoothStep(950, 1000, frame);
      // 5. 巨大噪音：爱与投机 (1000-1300帧)
      const noiseProgress = smoothStep(1000, 1050, frame) - smoothStep(1250, 1300, frame);
      // 6. 最后的戒律 (1300-1500帧)
      const rulesProgress = smoothStep(1300, 1350, frame);

      return (
        <div style={{ width: '100vw', height: '100vh', position: 'relative' }}>
          <div style={{
            width: '1920px', height: '1080px', transform: `scale(${scale})`, transformOrigin: 'top left',
            position: 'absolute', top: '50%', left: '50%', marginLeft: '-960px', marginTop: '-540px'
          }}>

            {/* 背景动态深空网格 */}
            <div style={{
              position: 'absolute', width: '200%', height: '200%', top: '-50%', left: '-50%',
              backgroundImage: 'linear-gradient(rgba(255, 215, 0, 0.03) 2px, transparent 2px), linear-gradient(90deg, rgba(255, 215, 0, 0.03) 2px, transparent 2px)',
              backgroundSize: '100px 100px', transform: `rotateX(60deg) translateY(${frame % 100}px)`, perspective: '1000px', opacity: 0.5
            }} />

            {/* ====== Scene 1: 跨越万年的线 ====== */}
            {introProgress > 0 && (
              <div style={{ position: 'absolute', inset: 0, opacity: introProgress, display: 'flex', justifyContent: 'center', alignItems: 'center', flexDirection: 'column' }}>
                <svg width="800" height="200" style={{ overflow: 'visible' }}>
                  <path d="M 0,100 Q 200,50 400,100 T 800,100" fill="none" stroke="#FFD700" strokeWidth="8" strokeDasharray="1000" strokeDashoffset={1000 * (1 - introProgress)} style={{ filter: 'drop-shadow(0 0 20px #FFD700)' }} />
                  <circle cx="400" cy="100" r={20 * introProgress} fill="#fff" style={{ filter: 'drop-shadow(0 0 30px #FFF)' }} />
                </svg>
                <div style={{ fontSize: '40px', letterSpacing: '10px', marginTop: '40px', color: '#FFD700', opacity: easeOutExp(introProgress) }}>公元前2024 ━ 公元后2024</div>
              </div>
            )}

            {/* ====== Scene 2: 21万吨的坍缩 (22米立方体) ====== */}
            {scarcityProgress > 0 && (
              <div style={{ position: 'absolute', inset: 0, opacity: scarcityProgress, display: 'flex', justifyContent: 'center', alignItems: 'center' }}>
                <div className="cube-container" style={{ transform: `scale(${easeOutExp(scarcityProgress) * 1.5})` }}>
                  <div className="cube">
                    <div className="face front"></div><div className="face back"></div>
                    <div className="face right"></div><div className="face left"></div>
                    <div className="face top"></div><div className="face bottom"></div>
                  </div>
                </div>
                {/* 对比的小人 */}
                <div style={{ position: 'absolute', bottom: '350px', left: '1050px', width: '10px', height: '30px', background: 'white', borderRadius: '5px', opacity: scarcityProgress, boxShadow: '0 0 10px white' }} />
                <h1 style={{ position: 'absolute', top: '150px', fontSize: '80px', color: '#fff', margin: 0 }}>210,000 吨 <span style={{fontSize: '40px', color: '#888'}}>全人类的总和</span></h1>
                <h2 style={{ position: 'absolute', bottom: '200px', fontSize: '60px', color: '#FFD700', letterSpacing: '5px' }}>22m × 22m × 22m</h2>
              </div>
            )}

            {/* ====== Scene 3: 南非霸主 ====== */}
            {supplyProgress > 0 && (
              <div style={{ position: 'absolute', inset: 0, opacity: supplyProgress }}>
                {/* 抽象柱状图山峰 */}
                <div style={{ position: 'absolute', bottom: 100, left: 0, right: 0, height: '600px', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', gap: '20px' }}>
                  {[40, 60, 30, 100, 50, 45].map((h, i) => (
                    <div key={i} style={{ 
                      width: '100px', height: `${h === 100 ? supplyProgress * 100 : supplyProgress * h}%`, 
                      background: h === 100 ? 'linear-gradient(to top, #B8860B, #FFD700, #FFF)' : '#222',
                      boxShadow: h === 100 ? '0 0 50px rgba(255,215,0,0.5)' : 'none',
                      transition: 'height 0.5s ease-out', position: 'relative'
                    }}>
                      {h === 100 && <div style={{position: 'absolute', top: '-60px', left: '-50px', width: '200px', textAlign: 'center', fontSize: '40px', color: '#FFD700', fontWeight: 'bold'}}>南非</div>}
                    </div>
                  ))}
                </div>
                <h1 style={{ position: 'absolute', top: '150px', width: '100%', textAlign: 'center', fontSize: '70px', color: '#fff', letterSpacing: '10px' }}>史上开采之王</h1>
              </div>
            )}

            {/* ====== Scene 4: 交易枢纽 (伦敦、纽约、上海) ====== */}
            {tradingProgress > 0 && (
              <div style={{ position: 'absolute', inset: 0, opacity: tradingProgress }}>
                <svg width="1920" height="1080" style={{ position: 'absolute', zIndex: 1 }}>
                  {/* 连接线 */}
                  <polygon points="560,600 960,300 1360,600" fill="none" stroke="rgba(255,215,0,0.3)" strokeWidth="4" strokeDasharray="20 20" style={{ animation: 'draw-line 2s linear infinite' }} />
                </svg>
                {/* 三大枢纽点 */}
                {[{name: 'LONDON', x: 560, y: 600, label: '柜台(OTC)中心'}, {name: 'NEW YORK', x: 960, y: 300, label: '期货与金库'}, {name: 'SHANGHAI', x: 1360, y: 600, label: '实体与期货枢纽'}].map((city, i) => (
                  <div key={i} style={{ position: 'absolute', left: city.x - 150, top: city.y - 150, width: '300px', height: '300px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                    <div style={{ width: '40px', height: '40px', background: '#FFD700', borderRadius: '50%', animation: 'pulse-ring 2s infinite' }} />
                    <h2 style={{ color: '#fff', fontSize: '30px', margin: '20px 0 5px 0', letterSpacing: '3px' }}>{city.name}</h2>
                    <p style={{ color: '#aaa', fontSize: '18px', margin: 0 }}>{city.label}</p>
                  </div>
                ))}
                <h1 style={{ position: 'absolute', bottom: '150px', width: '100%', textAlign: 'center', fontSize: '60px', color: '#FFD700' }}>全球三大流转中心</h1>
              </div>
            )}

            {/* ====== Scene 5: 爱、投机与噪音 ====== */}
            {noiseProgress > 0 && (
              <div style={{ position: 'absolute', inset: 0, opacity: noiseProgress, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center' }}>
                <h1 style={{ fontSize: '70px', marginBottom: '100px', display: 'flex', gap: '40px' }}>
                  <span style={{ color: '#fff' }}>抗通胀本质</span>
                  <span style={{ color: '#FF3366', textShadow: '0 0 30px rgba(255,51,102,0.8)' }}>VS 投机噪音</span>
                </h1>
                <svg width="1400" height="400" style={{ overflow: 'visible' }}>
                  {/* 平稳的价值线 */}
                  <path d="M0,200 L1400,200" stroke="rgba(255,255,255,0.3)" strokeWidth="4" strokeDasharray="10 10" />
                  {/* 疯狂波动的价格线 (动态修改 SVG path) */}
                  <path d="M 0,200 Q 100,50 200,200 T 400,200 T 600,200 T 800,200 T 1000,200 T 1200,200 T 1400,200" 
                        fill="none" stroke="#FFD700" strokeWidth="8" 
                        style={{ filter: 'drop-shadow(0 0 15px #FFD700)', animation: 'noise-wave 0.5s infinite linear' }} />
                </svg>
                <div style={{ position: 'absolute', bottom: '200px', fontSize: '40px', color: '#FF3366', fontWeight: 'bold', letterSpacing: '8px' }}>
                  PURE LOVE & SPECULATION
                </div>
              </div>
            )}

            {/* ====== Scene 6: 最后的戒律 ====== */}
            {rulesProgress > 0 && (
              <div style={{ position: 'absolute', inset: 0, opacity: rulesProgress, padding: '100px 150px' }}>
                <h1 style={{ fontSize: '70px', color: '#FFD700', borderBottom: '4px solid #FFD700', paddingBottom: '20px', display: 'inline-block' }}>交易精髓与戒律</h1>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '50px', marginTop: '60px' }}>
                  {['极高波动率：做好心理准备', '超长周期：保值需站在10年以上维度', '隐性成本：实体金交易磨损达5-20%', '仓位控制：切勿孤注一掷', '大道至简：少信短线技术分析'].map((rule, i) => (
                    <div key={i} style={{ 
                      background: 'rgba(255,215,0,0.05)', borderLeft: '8px solid #FFD700', padding: '40px', 
                      fontSize: '35px', color: '#fff', transform: `translateX(${rulesProgress * 0 === 0 ? 0 : 100}px)`,
                      boxShadow: '0 10px 30px rgba(0,0,0,0.5)'
                    }}>
                      <span style={{ color: '#FFD700', fontWeight: 'bold', marginRight: '20px' }}>0{i+1}</span>
                      {rule}
                    </div>
                  ))}
                </div>
                <h2 style={{ position: 'absolute', bottom: '80px', right: '150px', fontSize: '50px', color: '#fff', letterSpacing: '5px' }}>
                  FOLLOW YOUR <span style={{ color: '#FFD700' }}>HEART</span>
                </h2>
              </div>
            )}

            {/* 底部进度条 */}
            <div style={{ position: 'absolute', bottom: 0, left: 0, height: '4px', background: 'rgba(255,255,255,0.1)', width: '100%' }}>
              <div style={{ height: '100%', background: '#FFD700', width: `${(frame / TOTAL_FRAMES) * 100}%` }} />
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MasterpieceVisuals />);
  </script>
</body>
</html>
