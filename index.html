<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic Gold Bar</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    :root {
      --bg-color: #030303;
      --gold-light: #FFF7D6;
      --gold-base: #FFD700;
      --gold-mid: #D4AC0D;
      --gold-dark: #996515;
      --gold-shadow: #4A2E00;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Times New Roman", Times, serif;
    }

    /* 1. 戏剧性聚光灯 (Dramatic Spotlight) */
    .spotlight {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 120vw;
      height: 120vh;
      background: radial-gradient(ellipse at center, rgba(255, 215, 0, 0.12) 0%, rgba(0, 0, 0, 0) 60%);
      pointer-events: none;
      z-index: 10;
      mix-blend-mode: screen;
    }

    /* 3D 场景与推镜头动画 (Cinematic Slow-motion Push-in) */
    .scene {
      perspective: 1200px;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .camera {
      /* 缓慢向前推进并略微调整视角的运镜 */
      animation: cameraPush 12s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      transform-style: preserve-3d;
    }

    @keyframes cameraPush {
      0% { transform: scale(0.6) translateZ(-400px) rotateX(45deg) rotateY(-35deg); }
      100% { transform: scale(1.4) translateZ(150px) rotateX(25deg) rotateY(-15deg); }
    }

    /* 2. 构建超写实金砖 (Hyper-realistic Gold Bar) */
    .gold-bar {
      position: relative;
      width: 400px;
      height: 60px;
      transform-style: preserve-3d;
      /* 金砖底部的全局发光与阴影 */
      box-shadow: 0 50px 100px rgba(255, 215, 0, 0.2), 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .face {
      position: absolute;
      /* 模拟金属边缘的高光倒角 */
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-sizing: border-box;
    }

    /* 金砖的 6 个面及精细的金属光泽渐变 */
    .front {
      width: 400px; height: 60px;
      transform: translateZ(120px);
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-mid) 40%, var(--gold-shadow) 100%);
    }
    .back {
      width: 400px; height: 60px;
      transform: rotateY(180deg) translateZ(120px);
      background: var(--gold-shadow);
    }
    .right {
      width: 240px; height: 60px;
      transform: rotateY(90deg) translateZ(200px);
      background: linear-gradient(180deg, var(--gold-base) 0%, var(--gold-dark) 100%);
    }
    .left {
      width: 240px; height: 60px;
      transform: rotateY(-90deg) translateZ(200px);
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-mid) 100%);
    }
    .top {
      width: 400px; height: 240px;
      transform: rotateX(90deg) translateZ(30px);
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-base) 30%, var(--gold-dark) 80%, var(--bg-color) 100%);
      box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .bottom {
      width: 400px; height: 240px;
      transform: rotateX(-90deg) translateZ(30px);
      background: #111;
      box-shadow: 0 0 100px rgba(255, 215, 0, 0.5);
    }

    /* 金砖顶部的钢印刻字 */
    .engraving {
      color: var(--gold-dark);
      text-align: center;
      /* 深刻的内阴影效果模拟冲压钢印 */
      text-shadow: 1px 1px 0px rgba(255,255,255,0.4), -1px -1px 0px rgba(0,0,0,0.6);
      transform: rotateZ(-90deg); /* 调整文字方向对齐金砖长边 */
    }
    .engraving h1 { margin: 0; font-size: 36px; letter-spacing: 8px; }
    .engraving p { margin: 5px 0 0 0; font-size: 14px; letter-spacing: 4px; font-family: sans-serif; }

    /* 空气微尘动画 */
    @keyframes dustFloat {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-200px) translateX(50px); opacity: 0; }
    }
    .dust {
      position: absolute;
      background: #FFF;
      border-radius: 50%;
      filter: blur(1px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useState, useMemo } = React;

    function CinematicScene() {
      // 随机生成聚光灯下的空气微尘粒子
      const dustParticles = useMemo(() => {
        return Array.from({ length: 40 }).map((_, i) => ({
          id: i,
          left: `${Math.random() * 100}vw`,
          top: `${Math.random() * 100}vh`,
          size: `${Math.random() * 3 + 1}px`,
          duration: `${Math.random() * 5 + 5}s`,
          delay: `${Math.random() * 5}s`
        }));
      }, []);

      return (
        <div style={{ position: 'relative', width: '100vw', height: '100vh', backgroundColor: '#030303' }}>
          
          {/* 聚光灯层 */}
          <div className="spotlight"></div>

          {/* 粒子层 */}
          {dustParticles.map(p => (
            <div key={p.id} className="dust" style={{
              left: p.left, top: p.top, width: p.size, height: p.size,
              animation: `dustFloat ${p.duration} ease-in infinite ${p.delay}`
            }} />
          ))}

          {/* 3D 摄像机与主体层 */}
          <div className="scene">
            <div className="camera">
              
              <div className="gold-bar">
                <div className="face front"></div>
                <div className="face back"></div>
                <div className="face left"></div>
                <div className="face right"></div>
                <div className="face top">
                  <div className="engraving">
                    <h1>999.9</h1>
                    <p>FINE GOLD</p>
                    <p style={{fontSize: '10px', marginTop: '15px'}}>NET WT 1000g</p>
                  </div>
                </div>
                <div className="face bottom"></div>
              </div>

            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CinematicScene />);
  </script>
</body>
</html>
